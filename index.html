<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Catálogo</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue:       #0071E3;
    --petroleum:  #0A4A5A;
    --blue-soft:  #EAF3FF;
    --white:      #FFFFFF;
    --gray-bg:    #F5F5F7;
    --gray-line:  #E3E3E8;
    --text:       #1D1D1F;
    --text-sec:   #6E6E73;
  }

  html, body {
    height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    background: var(--white);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    display: flex; flex-direction: column;
    height: 100dvh; max-width: 430px; margin: 0 auto;
    background: var(--white);
    position: relative; overflow: hidden;
    animation: appIn .5s ease both;
  }
  @keyframes appIn { from { opacity: 0 } to { opacity: 1 } }

  /* ══ BANNER ══ */
  .banner {
    flex-shrink: 0; position: relative;
    width: 100%; height: 84px;
    background: var(--gray-bg);
    border-bottom: 1px solid var(--gray-line);
    overflow: hidden;
    animation: dropIn .55s .05s cubic-bezier(.22,.61,.36,1) both;
  }
  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-14px) }
    to   { opacity: 1; transform: translateY(0) }
  }
  .banner-img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: center;
    display: block;
    animation: kenBurns 18s ease-in-out infinite alternate;
  }
  @keyframes kenBurns {
    from { transform: scale(1)    translateX(0) }
    to   { transform: scale(1.07) translateX(-1.5%) }
  }
  .banner-empty {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px;
    background: var(--gray-bg);
    cursor: pointer; position: relative; overflow: hidden;
  }
  /* shimmer sweep on empty banner */
  .banner-empty::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.85) 50%, transparent 65%);
    transform: translateX(-100%);
    animation: sweep 3.4s ease-in-out infinite;
  }
  @keyframes sweep {
    0%, 55%  { transform: translateX(-100%) }
    100%     { transform: translateX(100%) }
  }
  .banner-empty-txt { font-size: .78rem; font-weight: 600; color: var(--text-sec); z-index: 1 }
  .banner-empty-sub { font-size: .64rem; color: #9a9aa0; z-index: 1 }

  /* ══ TABS ══ */
  .tabs {
    flex-shrink: 0; display: flex; gap: 2px;
    padding: 0 6px; position: relative;
    background: var(--white);
    border-bottom: 1px solid var(--gray-line);
    animation: dropIn .55s .12s cubic-bezier(.22,.61,.36,1) both;
  }
  .tab {
    flex: 1; min-width: 0; position: relative;
    padding: 11px 2px 10px;
    background: none; border: none; cursor: pointer;
    color: var(--text-sec);
    font-size: .68rem; font-weight: 500;
    letter-spacing: -.1px; line-height: 1.2;
    text-align: center;
    transition: color .25s, transform .16s;
  }
  .tab:active { transform: scale(.93) }
  .tab.active { color: var(--blue); font-weight: 700 }

  /* sliding underline */
  .tab-underline {
    position: absolute; bottom: 0; height: 2.5px;
    border-radius: 2px; background: var(--blue);
    transition: transform .38s cubic-bezier(.34,1.3,.5,1), width .38s cubic-bezier(.34,1.3,.5,1);
    pointer-events: none;
  }

  /* ══ CAROUSEL ══ */
  .carousel-area {
    flex: 1; position: relative; overflow: hidden;
    background: var(--blue-soft);
    animation: riseIn .6s .16s cubic-bezier(.22,.61,.36,1) both;
  }
  @keyframes riseIn {
    from { opacity: 0; transform: scale(1.025) }
    to   { opacity: 1; transform: scale(1) }
  }

  .slides {
    display: flex; height: 100%;
    transition: transform .5s cubic-bezier(.32,.72,0,1);
    will-change: transform;
  }
  .slide {
    flex-shrink: 0; width: 100%; height: 100%;
    position: relative; overflow: hidden;
    background: #eef3f9;
  }
  /* blurred cover copy fills the frame behind the full photo */
  .slide-backdrop {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    filter: blur(26px) brightness(0.85) saturate(1.1);
    transform: scale(1.15);
  }
  .slide-img {
    position: relative; z-index: 1;
    width: 100%; height: 100%;
    object-fit: contain; object-position: center;
    display: block; user-select: none; -webkit-user-drag: none;
  }
  /* active slide gets a slow drift — gives the photo life */
  .slide.is-active .slide-img {
    animation: drift 12s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: scale(1) }
    to   { transform: scale(1.035) }
  }

  /* empty photo slot */
  .slide-empty {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background:
      radial-gradient(circle at 50% 42%, #ffffff 0%, var(--blue-soft) 55%, #dcecff 100%);
  }
  .slot-icon {
    width: 66px; height: 66px; border-radius: 20px;
    background: rgba(0,113,227,.09);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    animation: breathe 3.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { transform: translateY(0)    scale(1) }
    50%     { transform: translateY(-7px) scale(1.04) }
  }
  /* soft halo pulsing out of the icon */
  .slot-icon::before {
    content: ''; position: absolute; inset: 0;
    border-radius: 20px;
    box-shadow: 0 0 0 0 rgba(0,113,227,.22);
    animation: halo 3.6s ease-out infinite;
  }
  @keyframes halo {
    0%   { box-shadow: 0 0 0 0 rgba(0,113,227,.22) }
    70%  { box-shadow: 0 0 0 26px rgba(0,113,227,0) }
    100% { box-shadow: 0 0 0 0 rgba(0,113,227,0) }
  }
  .slot-icon svg { width: 30px; height: 30px; stroke: var(--blue); }
  .slot-txt { font-size: .82rem; color: var(--text-sec); font-weight: 500 }
  .slot-count { font-size: .68rem; color: #9a9aa0; letter-spacing: .2px }

  /* ══ DOTS ══ */
  .dots {
    position: absolute; bottom: 46px; left: 50%;
    transform: translateX(-50%); z-index: 5;
    display: flex; gap: 5px; pointer-events: none;
    padding: 6px 10px; border-radius: 20px;
    background: rgba(0,0,0,.16);
    backdrop-filter: blur(10px);
  }
  .dots.hidden { display: none }
  .dot {
    width: 5px; height: 5px; border-radius: 3px;
    background: rgba(255,255,255,.5);
    transition: width .42s cubic-bezier(.34,1.4,.5,1), background .3s;
  }
  .dot.active { width: 22px; background: #fff }

  /* ══ WHATSAPP FLUTUANTE (sobre a foto) ══ */
  .wa-float {
    position: absolute; left: 14px; bottom: 14px; z-index: 6;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 0; border-radius: 0;
    background: none; box-shadow: none;
    text-decoration: none;
    color: var(--petroleum);
    font-size: 0.78rem; font-weight: 700; letter-spacing: -0.1px;
    transition: transform 0.16s;
    animation: liftIn .55s .22s cubic-bezier(.22,.61,.36,1) both;
  }
  .wa-float:active { transform: scale(.94) }
  @keyframes liftIn {
    from { opacity: 0; transform: translateY(14px) }
    to   { opacity: 1; transform: translateY(0) }
  }
  .wa-float svg { width: 18px; height: 18px; fill: #25D366; flex-shrink: 0; }

  .wa-icon { position: relative; display: flex; align-items: center }
  .wa-icon::after {
    content: ''; position: absolute; inset: 0;
    border-radius: 50%;
    box-shadow: 0 0 0 0 rgba(37,211,102,.4);
    animation: waRing 3s ease-out infinite;
  }
  @keyframes waRing {
    0%   { box-shadow: 0 0 0 0 rgba(37,211,102,.35) }
    70%  { box-shadow: 0 0 0 10px rgba(37,211,102,0) }
    100% { box-shadow: 0 0 0 0 rgba(37,211,102,0) }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important }
  }
</style>
</head>
<body>
<div class="app">

  <!-- BANNER -->
  <div class="banner" id="banner">
    <div class="banner-empty" id="bannerEmpty">
      <div class="banner-empty-txt">Toque para inserir seu banner</div>
    </div>
  </div>

  <!-- TABS -->
  <nav class="tabs" id="tabs">
    <button class="tab active" data-cat="milho">Milho</button>
    <button class="tab" data-cat="sorgo">Sorgo</button>
    <button class="tab" data-cat="nutricao">Nutrição</button>
    <button class="tab" data-cat="defensivos">Defensivos</button>
    <button class="tab" data-cat="solos">Solos</button>
    <span class="tab-underline" id="underline"></span>
  </nav>

  <!-- CAROUSEL -->
  <div class="carousel-area" id="carouselArea">
    <div class="slides" id="slides"></div>
    <div class="dots" id="dots"></div>

    <a href="https://wa.me/5563984376572" class="wa-float" target="_blank" rel="noopener">
      <span class="wa-icon">
        <svg viewBox="0 0 24 24">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
      </span>
      Raudinei Afonso
    </a>
  </div>

</div>

<script>
/* ══════════════════════════════════════════════════
   FOTOS DO CATÁLOGO
   Caminho relativo à pasta "imagem" (mesmo repositório do index.html).
   Padrão de nome: categoria-01.jpg, categoria-02.jpg...
   Posições vazias ('') são ignoradas — não ocupam
   espaço nem entram na rotação do carrossel.
   ══════════════════════════════════════════════════ */
const FOTOS = {
  milho: [
    'imagem/milho-01.jpg', 'imagem/milho-02.jpg', 'imagem/milho-03.jpg',
    'imagem/milho-04.jpg', 'imagem/milho-05.jpg', 'imagem/milho-06.jpg',
    'imagem/milho-07.jpg', 'imagem/milho-08.jpg', 'imagem/milho-09.jpg',
    'imagem/milho-10.jpg',
  ],
  sorgo: [
    'imagem/sorgo-01.jpg', 'imagem/sorgo-02.jpg', 'imagem/sorgo-03.jpg',
    'imagem/sorgo-04.jpg', 'imagem/sorgo-05.jpg',
  ],
  nutricao: [
    'imagem/nutricao-01.jpg', 'imagem/nutricao-02.jpg', 'imagem/nutricao-03.jpg',
    'imagem/nutricao-04.jpg', 'imagem/nutricao-05.jpg',
  ],
  defensivos: [
    'imagem/defensivos-01.jpg', 'imagem/defensivos-02.jpg', 'imagem/defensivos-03.jpg',
    'imagem/defensivos-04.jpg', 'imagem/defensivos-05.jpg',
  ],
  solos: [
    'imagem/solos-01.jpg', 'imagem/solos-02.jpg', 'imagem/solos-03.jpg',
    'imagem/solos-04.jpg', 'imagem/solos-05.jpg',
  ],
};

const ROTULOS = {
  milho: 'Milho', sorgo: 'Sorgo', nutricao: 'Nutrição',
  defensivos: 'Defensivos', solos: 'Solos',
};

let activeCat = 'milho', current = 0, timer = null;
const slidesEl = document.getElementById('slides');
const dotsEl   = document.getElementById('dots');

function fotosDaCategoria() {
  return FOTOS[activeCat].filter(Boolean);
}

function testarImagem(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload  = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = src;
  });
}

async function build() {
  const candidatos = fotosDaCategoria();
  const resultados = await Promise.all(candidatos.map(testarImagem));
  const fotos = candidatos.filter((_, i) => resultados[i]);

  slidesEl.innerHTML = '';
  dotsEl.innerHTML = '';
  current = 0;
  clearInterval(timer);

  if (!fotos.length) {
    // nenhuma foto encontrada nesta categoria ainda
    const nome = ROTULOS[activeCat];

    const s = document.createElement('div');
    s.className = 'slide is-active';
    s.innerHTML = `
      <div class="slide-empty">
        <div class="slot-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
        </div>
        <div class="slot-txt">Fotos de ${nome} não encontradas</div>
        <div class="slot-count">Verifique se os arquivos estão na pasta "imagem"</div>
      </div>`;
    slidesEl.appendChild(s);
    dotsEl.classList.add('hidden');
    return;
  }

  dotsEl.classList.toggle('hidden', fotos.length < 2);

  fotos.forEach((src, i) => {
    const s = document.createElement('div');
    s.className = 'slide' + (i === 0 ? ' is-active' : '');

    const backdrop = document.createElement('div');
    backdrop.className = 'slide-backdrop';
    backdrop.style.backgroundImage = `url("${src}")`;
    s.appendChild(backdrop);

    const img = document.createElement('img');
    img.className = 'slide-img';
    img.src = src;
    img.alt = '';
    img.loading = i === 0 ? 'eager' : 'lazy';
    s.appendChild(img);
    slidesEl.appendChild(s);

    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    dotsEl.appendChild(d);
  });

  goTo(0, false);
  if (fotos.length > 1) startAuto();
}

function goTo(idx, animate = true) {
  const total = slidesEl.children.length;
  if (!total) return;
  current = (idx + total) % total;

  if (!animate) slidesEl.style.transition = 'none';
  slidesEl.style.transform = `translateX(-${current * 100}%)`;
  if (!animate) requestAnimationFrame(() => slidesEl.style.transition = '');

  [...slidesEl.children].forEach((s, i) => s.classList.toggle('is-active', i === current));
  [...dotsEl.children].forEach((d, i) => d.classList.toggle('active', i === current));
}

function startAuto() {
  clearInterval(timer);
  timer = setInterval(() => goTo(current + 1), 4000);
}

/* swipe */
let startX = null;
const area = document.getElementById('carouselArea');
area.addEventListener('touchstart', e => { startX = e.touches[0].clientX; clearInterval(timer); }, { passive: true });
area.addEventListener('touchend', e => {
  if (startX === null) return;
  const dx = e.changedTouches[0].clientX - startX;
  startX = null;
  if (Math.abs(dx) > 40) goTo(dx < 0 ? current + 1 : current - 1);
  if (slidesEl.children.length > 1) startAuto();
}, { passive: true });

/* tabs + sliding underline */
const tabsEl = document.getElementById('tabs');
const underline = document.getElementById('underline');

function moveUnderline(tab) {
  const w = tab.offsetWidth * 0.62;
  underline.style.width = w + 'px';
  underline.style.transform = `translateX(${tab.offsetLeft + (tab.offsetWidth - w) / 2}px)`;
}

tabsEl.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  tabsEl.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  moveUnderline(tab);
  activeCat = tab.dataset.cat;
  build();
});

/* init */
build();
requestAnimationFrame(() => moveUnderline(tabsEl.querySelector('.tab.active')));
window.addEventListener('resize', () => moveUnderline(tabsEl.querySelector('.tab.active')));
</script>
</body>
</html>
